<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>문장에 알맞은 조사를 넣어봅시다</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Malgun Gothic', 'Nanum Gothic', sans-serif;
    }
    body {
      background-color: #f0f8ff;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 600px;
      background: white;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
      position: relative;
      min-height: 500px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 22px;
      color: #2c3e50;
      margin-bottom: 5px;
    }
    .sub-title {
      font-size: 16px;
      color: #7f8c8d;
      margin-top: 0;
    }
    /* 학생 선택 스타일 */
    .student-select-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin: 30px 0;
    }
    .student-card {
      background: #e8f4f8;
      border: 3px solid #3498db;
      border-radius: 15px;
      padding: 15px 10px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s;
    }
    .student-card:hover {
      transform: translateY(-5px);
      background-color: #d4e6f1;
    }
    .student-name {
      font-size: 20px;
      font-weight: bold;
      color: #2c3e50;
    }
    .student-level {
      font-size: 12px;
      color: #7f8c8d;
      margin-top: 5px;
    }
    /* 퀴즈 화면 스타일 */
    .progress-bar {
      font-size: 18px;
      font-weight: bold;
      color: #3498db;
      text-align: right;
      margin-bottom: 10px;
    }
    .question-box {
      background: #fff9e6;
      border: 2px dashed #f1c40f;
      border-radius: 15px;
      padding: 30px 15px;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 25px;
      line-height: 1.6;
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .blank-box {
      display: inline-block;
      min-width: 60px;
      height: 45px;
      border-bottom: 4px solid #3498db;
      background: #e8f4f8;
      border-radius: 8px;
      line-height: 40px;
      color: #2980b9;
      padding: 0 10px;
      margin: 0 4px;
    }
    .blank-box.active {
      border: 3px solid #e67e22;
      background: #fdebd0;
    }
    .options-grid {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .option-btn {
      background: #3498db;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 22px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 0 #2980b9;
      transition: all 0.1s;
    }
    .option-btn:active {
      transform: translateY(4px);
      box-shadow: none;
    }
    .submit-btn {
      width: 100%;
      background: #2ecc71;
      color: white;
      border: none;
      padding: 15px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 0 #27ae60;
      margin-top: 10px;
    }
    .submit-btn:disabled {
      background: #bdc3c7;
      box-shadow: none;
      cursor: not-allowed;
    }
    /* 결과 및 관리자 화면 */
    .result-header {
      text-align: center;
      background: #e8f8f5;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
    }
    .reinforcement {
      font-size: 28px;
      color: #27ae60;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .score {
      font-size: 20px;
      color: #2c3e50;
    }
    .review-list {
      max-height: 250px;
      overflow-y: auto;
      margin-bottom: 20px;
      padding-right: 5px;
    }
    .review-item {
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 10px;
      font-size: 15px;
    }
    .review-item.correct {
      background: #e8f8f5;
      border-left: 5px solid #2ecc71;
    }
    .review-item.wrong {
      background: #fadbd8;
      border-left: 5px solid #e74c3c;
    }
    .explanation {
      font-size: 13px;
      color: #7f8c8d;
      margin-top: 5px;
    }
    .admin-link {
      text-align: center;
      margin-top: 15px;
    }
    .admin-link button {
      background: none;
      border: none;
      color: #95a5a6;
      text-decoration: underline;
      cursor: pointer;
      font-size: 13px;
    }
    footer {
      text-align: center;
      font-size: 12px;
      color: #bdc3c7;
      margin-top: 15px;
    }
    .btn-secondary {
      background: #95a5a6;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 10px;
      cursor: pointer;
      width: 100%;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- 메인 화면 -->
  <div id="screen-main">
    <header>
      <h1>학습주제: 문장에 알맞은 조사를 넣어봅시다</h1>
      <p class="sub-title">공부할 학생을 선택해 주세요</p>
    </header>

    <div class="student-select-grid">
      <div class="student-card" onclick="startQuiz('임현우', 1)">
        <div class="student-name">임현우</div>
        <div class="student-level">lv1</div>
      </div>
      <div class="student-card" onclick="startQuiz('최재성', 2)">
        <div class="student-name">최재성</div>
        <div class="student-level">lv2</div>
      </div>
      <div class="student-card" onclick="startQuiz('김찬솔', 3)">
        <div class="student-name">김찬솔</div>
        <div class="student-level">lv3</div>
      </div>
    </div>

    <div class="admin-link">
      <button onclick="openAdmin()">관리자 모드</button>
    </div>
  </div>

  <!-- 퀴즈 화면 -->
  <div id="screen-quiz" class="hidden">
    <div class="progress-bar" id="quiz-progress">1 / 10</div>
    <div class="question-box" id="question-container">
      <!-- 문장과 빈칸이 동적으로 생성됨 -->
    </div>
    <div class="options-grid" id="options-container">
      <!-- 조사 버튼들이 동적으로 생성됨 -->
    </div>
    <button class="submit-btn" id="submit-btn" onclick="checkAnswer()" disabled>정답 확인하기</button>
  </div>

  <!-- 학생 결과 화면 -->
  <div id="screen-result" class="hidden">
    <div class="result-header">
      <div class="reinforcement" id="reinforcement-msg">최고야! 👍</div>
      <div class="score" id="result-score">10개 중 0개 맞았습니다!</div>
    </div>
    <div class="review-list" id="review-list">
      <!-- 맞은 문장, 틀린 문장 및 해설 생성됨 -->
    </div>
    <button class="btn-secondary" onclick="goMain()">처음 화면으로</button>
  </div>

  <!-- 관리자 화면 -->
  <div id="screen-admin" class="hidden">
    <header>
      <h1>관리자 모드 (학습 기록)</h1>
    </header>
    <div class="review-list" id="admin-records">
      <!-- 저장된 학생 기록 표시 -->
    </div>
    <button class="btn-secondary" onclick="goMain()">처음 화면으로</button>
  </div>

  <!-- 하단 제작자 표기 -->
  <footer>
    제작자: 묘량중앙초등학교 교사 김경탁
  </footer>
</div>

<script>
  // 문제 데이터베이스 (초등 특수학급 수준 맞춤)
  const db = {
    lv1: [ // 2어절, 조사 선택 1개 (이, 가)
      { parts: ["새", " 날아갑니다."], blanks: ["가"], choices: ["이", "가"], exp: "'새'는 받침이 없으므로 '가'가 맞습니다." },
      { parts: ["비", " 내립니다."], blanks: ["가"], choices: ["이", "가"], exp: "'비'는 받침이 없으므로 '가'가 맞습니다." },
      { parts: ["눈", " 옵니다."], blanks: ["이"], choices: ["이", "가"], exp: "'눈'은 받침이 있으므로 '이'가 맞습니다." },
      { parts: ["꽃", " 피었습니다."], blanks: ["이"], choices: ["이", "가"], exp: "'꽃'은 받침이 있으므로 '이'가 맞습니다." },
      { parts: ["해가", " 떴습니다."], blanks: ["가"], choices: ["이", "가"], exp: "'해'는 받침이 없으므로 '가'가 맞습니다." },
      { parts: ["물", " 흘러갑니다."], blanks: ["이"], choices: ["이", "가"], exp: "'물'은 받침이 있으므로 '이'가 맞습니다." },
      { parts: ["버스가", " 옵니다."], blanks: ["가"], choices: ["이", "가"], exp: "'버스'는 받침이 없으므로 '가'가 맞습니다." },
      { parts: ["밥", " 맛있습니다."], blanks: ["이"], choices: ["이", "가"], exp: "'밥'은 받침이 있으므로 '이'가 맞습니다." },
      { parts: ["나비", " 날아갑니다."], blanks: ["가"], choices: ["이", "가"], exp: "'나비'는 받침이 없으므로 '가'가 맞습니다." },
      { parts: ["공", " 구릅니다."], blanks: ["이"], choices: ["이", "가"], exp: "'공'은 받침이 있으므로 '이'가 맞습니다." }
    ],
    lv2: [ // 2어절, 조사 선택 1개 (은, 는, 이, 가)
      { parts: ["토끼", " 뛰어가요."], blanks: ["는"], choices: ["은", "는", "이", "가"], exp: "'토끼'는 받침이 없어서 '는' 또는 '가'가 어울립니다." },
      { parts: ["사과", " 맛있어요."], blanks: ["가"], choices: ["은", "는", "이", "가"], exp: "'사과'는 받침이 없어 '가'나 '는'이 어울립니다." },
      { parts: ["동생", " 자고 있어요."], blanks: ["이"], choices: ["은", "는", "이", "가"], exp: "'동생'은 받침이 있어 '이'나 '은'이 어울립니다." },
      { parts: ["하늘", " 푸릅니다."], blanks: ["이"], choices: ["은", "는", "이", "가"], exp: "'하늘'은 받침이 있으므로 '이'가 어울립니다." },
      { parts: ["선생님", " 웃으십니다."], blanks: ["은"], choices: ["은", "는", "이", "가"], exp: "'선생님'은 받침이 있으므로 '은'이나 '이'가 어울립니다." },
      { parts: ["강아지", " 짓습니다."], blanks: ["가"], choices: ["은", "는", "이", "가"], exp: "'강아지'는 받침이 없으므로 '가'가 어울립니다." },
      { parts: ["연필", " 뾰족해요."], blanks: ["은"], choices: ["은", "는", "이", "가"], exp: "'연필'은 받침이 있으므로 '은'이나 '이'가 어울립니다." },
      { parts: ["바람", " 불어옵니다."], blanks: ["이"], choices: ["은", "는", "이", "가"], exp: "'바람'은 받침이 있으므로 '이'가 어울립니다." },
      { parts: ["어머니", " 요리해요."], blanks: ["는"], choices: ["은", "는", "이", "가"], exp: "'어머니'는 받침이 없으므로 '는'이 어울립니다." },
      { parts: ["가방", " 무겁습니다."], blanks: ["이"], choices: ["은", "는", "이", "가"], exp: "'가방'은 받침이 있으므로 '이'가 어울립니다." }
    ],
    lv3: [ // 2-3어절, 조사 선택 2개 (은, 는, 이, 가, 을, 를)
      { parts: ["철수", " 사과", " 먹습니다."], blanks: ["는", "를"], choices: ["은", "는", "이", "가", "을", "를"], exp: "철수(는) 사과(를) 먹습니다가 자연스럽습니다." },
      { parts: ["고양이", " 생선", " 좋아해요."], blanks: ["가", "를"], choices: ["은", "는", "이", "가", "을", "를"], exp: "고양이(가) 생선(을) 좋아해요가 자연스럽습니다." },
      { parts: ["동생", " 장난감", " 가지고 놀아요."], blanks: ["이", "을"], choices: ["은", "는", "이", "가", "을", "를"], exp: "동생(이) 장난감(을) 가지고 놀아요가 자연스럽습니다." },
      { parts: ["민수", " 책", " 읽습니다."], blanks: ["는", "을"], choices: ["은", "는", "이", "가", "을", "를"], exp: "민수(는) 책(을) 읽습니다가 자연스럽습니다." },
      { parts: ["아빠", " 자동차", " 닦으십니다."], blanks: ["가", "를"], choices: ["은", "는", "이", "가", "을", "를"], exp: "아빠(가) 자동차(를) 닦으십니다가 자연스럽습니다." },
      { parts: ["친구", " 우유", " 마셔요."], blanks: ["가", "를"], choices: ["은", "는", "이", "가", "을", "를"], exp: "친구(가) 우유(를) 마셔요가 자연스럽습니다." },
      { parts: ["언니", " 옷", " 입어요."], blanks: ["는", "을"], choices: ["은", "는", "이", "가", "을", "를"], exp: "언니(는) 옷(을) 입어요가 자연스럽습니다." },
      { parts: ["강아지", " 뼈다귀", " 씹습니다."], blanks: ["가", "를"], choices: ["은", "는", "이", "가", "을", "를"], exp: "강아지(가) 뼈다귀(를) 씹습니다가 자연스럽습니다." },
      { parts: ["학생", " 숙제", " 합니다."], blanks: ["이", "를"], choices: ["은", "는", "이", "가", "을", "를"], exp: "학생(이) 숙제(를) 합니다가 자연스럽습니다." },
      { parts: ["할머니", " 꽃", " 가꾸십니다."], blanks: ["는", "을"], choices: ["은", "는", "이", "가", "을", "를"], exp: "할머니(는) 꽃(을) 가꾸십니다가 자연스럽습니다." }
    ]
  };

  const reinforcements = ["최고야! 👍", "멋져! ✨", "잘했어! 👏", "대단해! 🎉"];

  let currentStudent = "";
  let currentLevel = 1;
  let currentQuestions = [];
  let currentIndex = 0;
  let selectedAnswers = [];
  let userResults = [];
  let activeBlankIndex = 0;

  // 전체 기록 저장소 (로컬스토리지 활용)
  let adminData = JSON.parse(localStorage.getItem('special_edu_records') || '[]');

  function showScreen(screenId) {
    document.getElementById('screen-main').classList.add('hidden');
    document.getElementById('screen-quiz').classList.add('hidden');
    document.getElementById('screen-result').classList.add('hidden');
    document.getElementById('screen-admin').classList.add('hidden');

    document.getElementById(screenId).classList.remove('hidden');
  }

  function startQuiz(name, level) {
    currentStudent = name;
    currentLevel = level;
    currentIndex = 0;
    userResults = [];
    currentQuestions = db['lv' + level];

    showScreen('screen-quiz');
    loadQuestion();
  }

  function loadQuestion() {
    const q = currentQuestions[currentIndex];
    selectedAnswers = new Array(q.blanks.length).fill("");
    activeBlankIndex = 0;

    document.getElementById('quiz-progress').innerText = `${currentIndex + 1} / 10`;

    // 문제 화면 구성
    const qContainer = document.getElementById('question-container');
    qContainer.innerHTML = '';

    q.parts.forEach((part, idx) => {
      const textSpan = document.createElement('span');
      textSpan.innerText = part;
      qContainer.appendChild(textSpan);

      if (idx < q.blanks.length) {
        const blankBox = document.createElement('span');
        blankBox.className = 'blank-box' + (idx === 0 ? ' active' : '');
        blankBox.id = `blank-${idx}`;
        blankBox.innerText = '?';
        blankBox.onclick = () => selectBlank(idx);
        qContainer.appendChild(blankBox);
      }
    });

    // 선택지 버튼 구성
    const optContainer = document.getElementById('options-container');
    optContainer.innerHTML = '';

    q.choices.forEach(choice => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.innerText = choice;
      btn.onclick = () => chooseOption(choice);
      optContainer.appendChild(btn);
    });

    updateSubmitBtn();
  }

  function selectBlank(index) {
    activeBlankIndex = index;
    const q = currentQuestions[currentIndex];
    for (let i = 0; i < q.blanks.length; i++) {
      const el = document.getElementById(`blank-${i}`);
      if (i === index) el.classList.add('active');
      else el.classList.remove('active');
    }
  }

  function chooseOption(choice) {
    selectedAnswers[activeBlankIndex] = choice;
    const blankEl = document.getElementById(`blank-${activeBlankIndex}`);
    blankEl.innerText = choice;

    const q = currentQuestions[currentIndex];
    // 빈칸이 여러 개일 때 다음 빈칸으로 자동 이동
    if (activeBlankIndex < q.blanks.length - 1) {
      selectBlank(activeBlankIndex + 1);
    }

    updateSubmitBtn();
  }

  function updateSubmitBtn() {
    const q = currentQuestions[currentIndex];
    const allFilled = selectedAnswers.every(ans => ans !== "");
    document.getElementById('submit-btn').disabled = !allFilled;
  }

  function checkAnswer() {
    const q = currentQuestions[currentIndex];
    const isCorrect = JSON.stringify(selectedAnswers) === JSON.stringify(q.blanks);

    // 완전한 제출 문장 생성
    let fullSentence = "";
    q.parts.forEach((p, i) => {
      fullSentence += p;
      if (i < selectedAnswers.length) {
        fullSentence += `[${selectedAnswers[i]}]`;
      }
    });

    let correctSentence = "";
    q.parts.forEach((p, i) => {
      correctSentence += p;
      if (i < q.blanks.length) {
        correctSentence += `[${q.blanks[i]}]`;
      }
    });

    userResults.push({
      questionNum: currentIndex + 1,
      userSentence: fullSentence,
      correctSentence: correctSentence,
      isCorrect: isCorrect,
      explanation: q.exp
    });

    currentIndex++;
    if (currentIndex < 10) {
      loadQuestion();
    } else {
      finishQuiz();
    }
  }

  function finishQuiz() {
    const correctCount = userResults.filter(r => r.isCorrect).length;

    // 강화 문구 무작위 선정
    const randomReinforce = reinforcements[Math.floor(Math.random() * reinforcements.length)];
    document.getElementById('reinforcement-msg').innerText = randomReinforce;
    document.getElementById('result-score').innerText = `10개 중 ${correctCount}개 맞았습니다!`;

    // 결과 목록 세팅
    const listEl = document.getElementById('review-list');
    listEl.innerHTML = '';

    userResults.forEach(r => {
      const item = document.createElement('div');
      item.className = `review-item ${r.isCorrect ? 'correct' : 'wrong'}`;

      let content = `<strong>${r.questionNum}번: ${r.userSentence}</strong> (${r.isCorrect ? '⭕ 정답' : '❌ 오답'})`;
      if (!r.isCorrect) {
        content += `<div class="explanation">👉 바른 표현: ${r.correctSentence}<br>💡 해설: ${r.explanation}</div>`;
      }
      item.innerHTML = content;
      listEl.appendChild(item);
    });

    // 관리자용 기록 저장
    const record = {
      date: new Date().toLocaleString('ko-KR'),
      student: currentStudent,
      level: currentLevel,
      score: correctCount,
      details: userResults
    };
    adminData.unshift(record);
    localStorage.setItem('special_edu_records', JSON.stringify(adminData));

    showScreen('screen-result');
  }

  function openAdmin() {
    const pw = prompt("관리자 비밀번호를 입력하세요:");
    if (pw === "5800") {
      renderAdminRecords();
      showScreen('screen-admin');
    } else if (pw !== null) {
      alert("비밀번호가 올바르지 않습니다.");
    }
  }

  function renderAdminRecords() {
    const container = document.getElementById('admin-records');
    container.innerHTML = '';

    if (adminData.length === 0) {
      container.innerHTML = '<p style="text-align:center; color:#7f8c8d;">저장된 학습 기록이 없습니다.</p>';
      return;
    }

    adminData.forEach(rec => {
      const card = document.createElement('div');
      card.style.background = '#f8f9fa';
      card.style.border = '1px solid #dee2e6';
      card.style.borderRadius = '10px';
      card.style.padding = '15px';
      card.style.marginBottom = '15px';

      let html = `<div style="font-weight:bold; font-size:16px;">${rec.student} (lv${rec.level}) - 점수: ${rec.score}/10</div>`;
      html += `<div style="font-size:12px; color:#6c757d; margin-bottom:10px;">학습시간: ${rec.date}</div>`;

      rec.details.forEach(d => {
        html += `<div style="font-size:13px; margin-left:10px; color:${d.isCorrect ? '#27ae60' : '#e74c3c'};">`;
        html += `${d.questionNum}번: ${d.userSentence} ${d.isCorrect ? '⭕' : '❌'}`;
        if (!d.isCorrect) {
          html += ` <span style="color:#7f8c8d;">(정답: ${d.correctSentence})</span>`;
        }
        html += `</div>`;
      });

      card.innerHTML = html;
      container.appendChild(card);
    });
  }

  function goMain() {
    showScreen('screen-main');
  }
</script>
</body>
</html>
